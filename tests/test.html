<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Besin Takip — Testler</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:24px}.ok{color:#0a7a3d}.fail{color:#c0271f;font-weight:600}.warn{color:#8a6100}</style>
</head>
<body>
<h1>Besin Takip — Testler</h1>
<pre id="out">çalışıyor…</pre>
<script src="../js/nutrients.js"></script>
<script src="../js/calc.js"></script>
<script src="../js/foods-data.js"></script>
<script src="../js/foods.js"></script>
<script src="../js/exercises-data.js"></script>
<script src="../js/exercises.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/backup.js"></script>
<script src="../js/rda.js"></script>
<script>
(function () {
  var out = [], fails = 0;
  function t(ad, kosul) { if (!kosul) fails++; out.push((kosul ? 'GEÇTİ  ' : 'BAŞARISIZ  ') + ad); }
  function yakin(a, b, e) { return Math.abs(a - b) <= (e || 1e-9); }

  /* --- Hesaplama --- */
  t('150 g × 52 kcal/100 g = 78 kcal', yakin(Calc.scale({ kcal: 52 }, 150).kcal, 78));
  t('Bilinmeyen değer null kalır (0 olmaz)', Calc.scale({ kcal: 52 }, 150).lif === null);
  t('Glisemik indeks miktarla ölçeklenmez', Calc.scale({ gi: 55 }, 300).gi === 55);

  var s = Calc.sum([
    { degerler: { kcal: 100, lif: 2 }, gram: 200 },
    { degerler: { kcal: 50, lif: null }, gram: 100 }
  ]);
  t('Toplam kcal = 250', yakin(s.toplam.kcal, 250));
  t('Toplam lif yalnızca bilinenleri sayar (4)', yakin(s.toplam.lif, 4));
  t('Lif için eksik veri sayacı = 1', s.eksik.lif === 1);
  t('Kalori için eksik veri sayacı = 0', s.eksik.kcal === 0);

  t('fmt: null -> "—"', Calc.fmt(null, 'g') === '—');
  t('fmt: 78 kcal -> "78"', Calc.fmt(78.4, 'kcal') === '78');

  /* --- Türkçe arama normalleştirme --- */
  t('norm("Işık ŞEKER Çay") = "isik seker cay"', Calc.norm('Işık ŞEKER Çay') === 'isik seker cay');
  t('norm("İncir") = "incir"', Calc.norm('İncir') === 'incir');
  t('norm("Ğ ö ü") = "g o u"', Calc.norm('Ğ ö ü') === 'g o u');
  t('Arama "sut" -> Süt ürünleri bulur', Foods.search('sut').some(function (f) { return f.ad.indexOf('Süt') === 0; }));
  t('Arama "MERCİMEK" bulur', Foods.search('MERCİMEK').length >= 2);
  t('Arama "ekmek kepek yok" -> boş', Foods.search('zzzz').length === 0);
  t('Kategori filtresi çalışır', Foods.search('', { kategori: 'Meyve' }).every(function (f) { return f.kategori === 'Meyve'; }));

  /* --- Veri bütünlüğü --- */
  var ids = {}, dup = [];
  Foods.ALL.forEach(function (f) { if (ids[f.id]) dup.push(f.ad); ids[f.id] = 1; });
  t('Tüm besin kimlikleri benzersiz' + (dup.length ? ' (çakışan: ' + dup.join(', ') + ')' : ''), dup.length === 0);

  var bosKcal = Foods.ALL.filter(function (f) { return f.degerler.kcal == null; });
  t('Her besinde kalori değeri var', bosKcal.length === 0);
  var negatif = Foods.ALL.filter(function (f) { return Object.keys(f.degerler).some(function (k) { return f.degerler[k] != null && f.degerler[k] < 0; }); });
  t('Negatif değer yok', negatif.length === 0);
  var portBos = Foods.ALL.filter(function (f) { return !f.porsiyonlar.length || !(f.varsayilan_g > 0); });
  t('Her besinin porsiyonu ve varsayılan gramı var', portBos.length === 0);
  t('Makro toplamı 100 g’ı aşmıyor (protein+karb+yağ ≤ 101)', Foods.ALL.every(function (f) {
    var d = f.degerler; return (d.protein + d.karb + d.yag) <= 101;
  }));
  var tutarsiz = Foods.ALL.filter(function (f) {
    var d = f.degerler;
    return !((d.seker == null || d.seker <= d.karb + 0.05) && (d.doymus == null || d.doymus <= d.yag + 0.05));
  }).map(function (f) { return f.ad; });
  t('Şeker ≤ karbonhidrat, doymuş ≤ yağ' + (tutarsiz.length ? ' (sorunlu: ' + tutarsiz.join(', ') + ')' : ''), tutarsiz.length === 0);

  /* --- Yedekleme mantığı --- */
  var S2 = Storage.SCHEMA_VERSION;
  var ornek = {
    settings: [{ key: 'tema', value: 'koyu' }, { key: 'sonYedek', value: '2026-01-01T00:00:00Z' }],
    favorites: [{ id: 'h-bal' }], recents: [{ id: 'h-bal', ts: 5 }],
    log: [{ id: 'a1', tarih: '2026-09-20', ogun: 'öğle', besin_id: 'h-bal', miktar_g: 20, saat: '12:30' },
          { id: 'a2', tarih: '2026-09-20', ogun: 'kahvaltı', besin_id: 'h-ayran', miktar_g: 200 }]
  };
  var paket = Backup.paketle(ornek, S2);
  t('Paket: sonYedek dışarı yazılmaz', !paket.settings.some(function (s) { return s.key === 'sonYedek'; }));
  t('Paket: uygulama ve sürüm işaretli', paket.uygulama === 'besin-takip' && paket.schemaVersion === S2);
  var js = JSON.parse(JSON.stringify(paket));
  var d1 = Backup.dogrula(js, S2);
  t('Geçerli yedek kabul edilir', d1.ok && d1.veri.log.length === 2);
  t('Bozuk: nesne değil', !Backup.dogrula([], S2).ok && !Backup.dogrula(null, S2).ok && !Backup.dogrula('x', S2).ok);
  t('Bozuk: başka uygulamanın dosyası', !Backup.dogrula({ uygulama: 'baska', schemaVersion: 1 }, S2).ok);
  t('Bozuk: daha yeni sürüm reddedilir', !Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: S2 + 1 }, S2).ok);
  function bozLog(degis) { var c = JSON.parse(JSON.stringify(paket)); degis(c.log[0]); return Backup.dogrula(c, S2).ok; }
  t('Bozuk: geçersiz tarih (2026-02-30)', !bozLog(function (e) { e.tarih = '2026-02-30'; }));
  t('Bozuk: geçersiz öğün', !bozLog(function (e) { e.ogun = 'gece'; }));
  t('Bozuk: negatif miktar', !bozLog(function (e) { e.miktar_g = -5; }));
  t('Bozuk: miktar sayı değil', !bozLog(function (e) { e.miktar_g = '20'; }));
  t('Bozuk: besin_id yok', !bozLog(function (e) { delete e.besin_id; }));
  t('Bozuk: yinelenen kimlik', (function () { var c = JSON.parse(JSON.stringify(paket)); c.log[1].id = 'a1'; return !Backup.dogrula(c, S2).ok; })());
  var v1 = Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: 1, settings: [{ key: 'tema', value: 'acik' }], favorites: [{ id: 'h-bal' }] }, S2);
  t('Göç: v1 yedeği (log yok) güncel sürüme yükseltilir', v1.ok && v1.veri.schemaVersion === S2 && Array.isArray(v1.veri.log) && v1.veri.log.length === 0);
  var v2 = Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: 2, log: [{ id: 'z1', tarih: '2026-09-22', ogun: 'öğle', besin_id: 'h-bal', miktar_g: 20 }] }, S2);
  t('Göç: v2 yedeği kayıp olmadan güncel sürüme yükseltilir', v2.ok && v2.veri.schemaVersion === S2 && v2.veri.log.length === 1 && v2.veri.log[0].miktar_g === 20);
  t('Şema sürümü 6 (su, kendi hareket, antrenman günlüğü, favori antrenman, gün tamamlama depoları)', S2 === 6);

  /* --- Yedekleme: su / hareket / antrenman / favori antrenman / gün tamamlama (şema 6) --- */
  var ornek5 = {
    suKayitlari: [{ id: 's1', tarih: '2026-09-22', ml: 200, saat: '09:00' }],
    ozelHareketler: [{ id: 'e-1', ad: 'Trap Bar Deadlift', kategori: 'Bacak' }],
    antrenmanGunlugu: [{ id: 'a-1', tarih: '2026-09-22', hareket_id: 'e-squat-barbell',
      setler: [{ tekrar: 10 }, { tekrar: 8, agirlik_kg: 60, dinlenme_sn: 90 }], saat: '18:00' }],
    favoriAntrenmanlar: [{ id: 'fa-1', ad: 'Bacak günü', hareketler: [{ hareket_id: 'e-squat-barbell', setler: [{ tekrar: 10 }] }] }],
    gunTamamlamalar: [{ id: '2026-09-22', tamamlandi: true, zaman: '2026-09-22T20:00:00.000Z' }]
  };
  var p5 = Backup.paketle(ornek5, S2);
  t('Yedek: su/hareket/antrenman/favori antrenman/gün tamamlama pakete girer',
    p5.suKayitlari.length === 1 && p5.ozelHareketler.length === 1 && p5.antrenmanGunlugu.length === 1 &&
    p5.favoriAntrenmanlar.length === 1 && p5.gunTamamlamalar.length === 1);
  var d5 = Backup.dogrula(JSON.parse(JSON.stringify(p5)), S2);
  t('Yedek: şema 6 paketi doğrulanır', d5.ok && d5.veri.antrenmanGunlugu[0].setler.length === 2 && d5.veri.gunTamamlamalar[0].id === '2026-09-22');
  var v4 = Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: 4, log: [] }, S2);
  t('Göç: v4 yedeği güncel sürüme yükseltilir, yeni bölümler boş dizi olur',
    v4.ok && v4.veri.schemaVersion === S2 && v4.veri.suKayitlari.length === 0 && v4.veri.antrenmanGunlugu.length === 0 && v4.veri.gunTamamlamalar.length === 0);
  var v5 = Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: 5, log: [], suKayitlari: [] }, S2);
  t('Göç: v5 yedeği güncel sürüme yükseltilir, gunTamamlamalar boş dizi olur',
    v5.ok && v5.veri.schemaVersion === S2 && v5.veri.gunTamamlamalar.length === 0);

  function boz5(bolum, degis) { var c = JSON.parse(JSON.stringify(p5)); degis(c[bolum][0]); return Backup.dogrula(c, S2).ok; }
  t('Bozuk: su kaydında geçersiz tarih', !boz5('suKayitlari', function (s) { s.tarih = '2026-13-01'; }));
  t('Bozuk: su kaydında negatif ml', !boz5('suKayitlari', function (s) { s.ml = -50; }));
  t('Bozuk: kendi hareket adı yok', !boz5('ozelHareketler', function (e) { e.ad = ''; }));
  t('Bozuk: antrenmanda set listesi boş', !boz5('antrenmanGunlugu', function (a) { a.setler = []; }));
  t('Bozuk: antrenmanda set tekrarı sıfır', !boz5('antrenmanGunlugu', function (a) { a.setler[0].tekrar = 0; }));
  t('Bozuk: antrenmanda hareket eksik', !boz5('antrenmanGunlugu', function (a) { delete a.hareket_id; }));
  t('Bozuk: favori antrenmanda hareket listesi boş', !boz5('favoriAntrenmanlar', function (f) { f.hareketler = []; }));
  t('Bozuk: gün tamamlamada geçersiz tarih', !boz5('gunTamamlamalar', function (g) { g.id = '31-12-2026'; }));
  t('Bozuk: gün tamamlamada durum true değil', !boz5('gunTamamlamalar', function (g) { g.tamamlandi = 'evet'; }));
  t('Bozuk: gün tamamlamada yinelenen tarih', (function () {
    var c = JSON.parse(JSON.stringify(p5));
    c.gunTamamlamalar.push({ id: '2026-09-22', tamamlandi: true });
    return !Backup.dogrula(c, S2).ok;
  })());

  /* --- Hareket veritabanı (Exercises) --- */
  var eIds = {}, eDup = [];
  Exercises.ALL.forEach(function (e) { if (eIds[e.id]) eDup.push(e.ad); eIds[e.id] = 1; });
  t('Hareketler: tüm kimlikler benzersiz' + (eDup.length ? ' (çakışan: ' + eDup.join(', ') + ')' : ''), eDup.length === 0);
  t('Hareketler: en az 60 hazır hareket var (şu an ' + Exercises.ALL.length + ')', Exercises.ALL.length >= 60);
  t('Hareketler: arama "squat" bulur', Exercises.search('squat').length > 0);
  t('Hareketler: Türkçe karakter toleranslı arama ("gogus" -> Göğüs kategorisi)', Exercises.search('', { kategori: 'Göğüs' }).length > 0);
  t('Hareketler: kategori filtresi doğru çalışır', Exercises.search('', { kategori: 'Bacak' }).every(function (e) { return e.kategori === 'Bacak'; }));
  var oncekiHareketSayisi = Exercises.ALL.length;
  Exercises.guncelle([{ id: 'k-test', ad: 'Test Hareketi', kategori: 'Diğer' }]);
  t('Hareketler: kendi hareket eklenince listeye girer', Exercises.ALL.length === oncekiHareketSayisi + 1 && !!Exercises.BY_ID['k-test']);
  Exercises.guncelle([]);
  t('Hareketler: liste geri alınır (hazır hareketler bozulmaz)', Exercises.ALL.length === oncekiHareketSayisi && !Exercises.BY_ID['k-test']);

  var csv = Backup.csv(ornek.log, Foods.BY_ID);
  var satirlar = csv.replace('﻿', '').trim().split('\r\n');
  t('CSV: UTF-8 BOM ile başlar', csv.charAt(0) === '﻿');
  t('CSV: başlık + 2 kayıt satırı', satirlar.length === 3);
  t('CSV: kahvaltı öğleden önce sıralanır', satirlar[1].indexOf('kahvaltı') > -1 && satirlar[2].indexOf('öğle') > -1);
  t('CSV: her satırda aynı sütun sayısı', satirlar.every(function (s) { return s.split(';').length === satirlar[0].split(';').length; }));
  t('CSV: ondalık virgül (Ayran 200 g = 72 kcal, Bal 20 g protein 0,06)', satirlar[1].split(';')[6] === '72' && satirlar[2].indexOf('0,06') > -1);
  t('CSV: formül enjeksiyonu engellenir', Backup.hucre('=CMD()') === "'=CMD()" && Backup.hucre('a;b') === '"a;b"' && Backup.hucre('a"b') === '"a""b"');
  t('CSV: bilinmeyen değer boş bırakılır (0 değil)', Backup.hucre(null) === '');

  /* --- Mikro besin referansları ve makro enerji payı --- */
  t('RDA: C vitamini 45 mg = referansın %50si', yakin(RDA.yuzde('vitC', 45), 50));
  t('RDA: referansı olmayan alan null döner', RDA.yuzde('kafein', 100) === null && RDA.yuzde('kcal', 2000) === null);
  t('RDA: bilinmeyen değer null döner', RDA.yuzde('demir', null) === null);
  t('RDA: sodyum üst sınır olarak işaretli', RDA.DV.sodyum.ust === true && !RDA.DV.demir.ust);
  var rdaBilinmeyen = Object.keys(RDA.DV).filter(function (k) { return !Nutrients.BY_KEY[k]; });
  t('RDA: tüm anahtarlar besin alanlarıyla eşleşiyor' + (rdaBilinmeyen.length ? ' (eşleşmeyen: ' + rdaBilinmeyen.join(', ') + ')' : ''), rdaBilinmeyen.length === 0);
  var rdaBirim = Object.keys(RDA.DV).filter(function (k) { return RDA.DV[k].b !== Nutrients.BY_KEY[k].b; });
  t('RDA: birimler besin alanlarıyla aynı' + (rdaBirim.length ? ' (farklı: ' + rdaBirim.join(', ') + ')' : ''), rdaBirim.length === 0);
  t('RDA: kaynak belirtilmiş', /FDA/.test(RDA.KAYNAK));

  var mkt = Calc.makroKalori({ protein: 10, karb: 20, yag: 5 });
  t('Makro enerji: 10 g protein = 40 kcal, 20 g karb = 80 kcal, 5 g yağ = 45 kcal',
    yakin(mkt.protein, 40) && yakin(mkt.karb, 80) && yakin(mkt.yag, 45));
  t('Makro enerji: eksik makro 0 sayılır (grafik payı bozulmaz)', yakin(Calc.makroKalori({}).protein, 0));

  /* --- Kendi besin, tarif, favori öğün (şema 4) --- */
  var ornek4 = {
    ozelBesinler: [{ id: 'k-1', ad: 'Annemin keki', kategori: 'Kendi besinim', varsayilan_g: 80,
                     porsiyonlar: [{ ad: '1 dilim', g: 80 }], degerler: { kcal: 350, protein: 6, karb: 45, yag: 16 } }],
    tarifler: [{ id: 't-1', ad: 'Yulaflı kahvaltı', toplam_g: 250,
                 bilesenler: [{ besin_id: 'h-yulaf-ezmesi-cig', gram: 50 }, { besin_id: 'h-sut-tam-yagli', gram: 200 }] }],
    favoriOgunler: [{ id: 'f-1', ad: 'Standart kahvaltım', ogun: 'kahvaltı',
                      kalemler: [{ besin_id: 'h-yumurta-haslanmis', miktar_g: 100 }, { besin_id: 'h-beyaz-ekmek', miktar_g: 60 }] }]
  };
  var p4 = Backup.paketle(ornek4, S2);
  t('Yedek: kendi besin, tarif ve favori öğün pakete girer',
    p4.ozelBesinler.length === 1 && p4.tarifler.length === 1 && p4.favoriOgunler.length === 1);
  var d4 = Backup.dogrula(JSON.parse(JSON.stringify(p4)), S2);
  t('Yedek: şema 4 paketi doğrulanır', d4.ok && d4.veri.tarifler[0].toplam_g === 250);
  var v3 = Backup.dogrula({ uygulama: 'besin-takip', schemaVersion: 3, log: [] }, S2);
  t('Göç: v3 yedeği güncel sürüme yükseltilir, yeni bölümler boş dizi olur',
    v3.ok && v3.veri.schemaVersion === S2 && v3.veri.ozelBesinler.length === 0 && v3.veri.tarifler.length === 0);

  function boz4(bolum, degis) {
    var c = JSON.parse(JSON.stringify(p4));
    degis(c[bolum][0]);
    return Backup.dogrula(c, S2).ok;
  }
  t('Bozuk: kendi besinde ad yok', !boz4('ozelBesinler', function (b) { b.ad = '  '; }));
  t('Bozuk: kendi besinde kalori sayı değil', !boz4('ozelBesinler', function (b) { b.degerler.kcal = 'abc'; }));
  t('Bozuk: kendi besinde porsiyon gramı sıfır', !boz4('ozelBesinler', function (b) { b.porsiyonlar[0].g = 0; }));
  t('Bozuk: tarifte bileşen listesi boş', !boz4('tarifler', function (x) { x.bilesenler = []; }));
  t('Bozuk: tarifte bileşen miktarı negatif', !boz4('tarifler', function (x) { x.bilesenler[0].gram = -5; }));
  t('Bozuk: tarifte toplam ağırlık sıfır', !boz4('tarifler', function (x) { x.toplam_g = 0; }));
  t('Bozuk: favori öğünde besin listesi boş', !boz4('favoriOgunler', function (x) { x.kalemler = []; }));

  /* Tarif → besin dönüşümü: 50 g yulaf (379 kcal/100g) + 200 g süt (61 kcal/100g) = 189,5+122 = 311,5 kcal / 250 g */
  var tb = Foods.tarifBesine(ornek4.tarifler[0], Foods.BY_ID);
  t('Tarif: 100 g başına kalori doğru hesaplanır (311,5 kcal / 250 g = 124,6)', yakin(tb.degerler.kcal, 124.6, 0.05));
  t('Tarif: porsiyon tanımı üretilir', tb.porsiyonlar.length >= 1 && tb.porsiyonlar[0].g === 250);
  t('Tarif: kategori "Tarif" ve doğrulanmamış', tb.kategori === 'Tarif' && tb.dogrulandi === false);
  var tbBos = Foods.tarifBesine({ id: 'x', ad: 'Boş', toplam_g: 100, bilesenler: [{ besin_id: 'yok-boyle-besin', gram: 50 }] }, Foods.BY_ID);
  t('Tarif: bilinmeyen bileşen değeri null yapar (0 sayılmaz)', tbBos.degerler.kcal === null);

  /* Foods.guncelle: kendi besinler ve tarifler aramaya karışır */
  var oncekiSayi = Foods.ALL.length;
  Foods.guncelle(ornek4.ozelBesinler, ornek4.tarifler);
  t('Foods: kendi besin ve tarif listeye eklenir', Foods.ALL.length === oncekiSayi + 2);
  t('Foods: kendi besin aramada bulunur', Foods.search('annemin').length === 1);
  t('Foods: tarif aramada bulunur', Foods.search('yulafli kahvalti').length === 1);
  t('Foods: kendi besin kimlikle erişilir', !!Foods.BY_ID['k-1'] && Foods.BY_ID['k-1'].kendi === true);
  Foods.guncelle([], []);
  t('Foods: liste geri alınır (hazır besinler bozulmaz)', Foods.ALL.length === oncekiSayi && !Foods.BY_ID['k-1']);

  out.push('');
  out.push('Besin sayısı: ' + Foods.ALL.length + '  (hedef: 500+)');
  out.push('Doğrulanmamış besin: ' + Foods.ALL.filter(function (f) { return !f.dogrulandi; }).length);

  /* --- Veri kalite uyarısı: Atwater tutarlılığı (bilgi amaçlı, test başarısız saymaz) --- */
  var sapma = [];
  Foods.ALL.forEach(function (f) {
    var d = f.degerler, alkolKcal = (d.alkol || 0) * 7;
    var hesap = d.protein * 4 + (d.karb - (d.lif || 0)) * 4 + (d.lif || 0) * 2 + d.yag * 9 + alkolKcal;
    if (d.kcal < 15) return;
    var oran = Math.abs(hesap - d.kcal) / d.kcal;
    if (oran > 0.2) sapma.push(f.ad + ' (yazılan ' + d.kcal + ', hesaplanan ' + Math.round(hesap) + ' kcal)');
  });
  out.push('');
  out.push('Atwater sapması >%20 olan besinler (gözden geçir): ' + sapma.length);
  sapma.forEach(function (x) { out.push('  UYARI  ' + x); });

  /* --- Depolama gidiş-dönüş (bellek modu; IndexedDB açılmadan): yedek al -> sil -> geri yükle --- */
  var sirali = Storage.degistirHepsini(ornek)
    .then(function () { return Storage.exportParcalari(); })
    .then(function (p) {
      var yedek = JSON.parse(JSON.stringify(Backup.paketle(p, S2)));
      t('Depolama: dışa aktarılan yedek 2 öğün kaydı içerir', yedek.log.length === 2);
      return Storage.degistirHepsini({}).then(function () { return Storage.tumLog(); }).then(function (bos) {
        t('Depolama: silince hiç kayıt kalmaz', bos.length === 0);
        var d = Backup.dogrula(yedek, S2);
        return Storage.degistirHepsini(d.veri);
      }).then(function () { return Storage.tumLog(); }).then(function (geri) {
        t('Depolama: içe aktarınca kayıtlar geri gelir', geri.length === 2 && geri.some(function (e) { return e.id === 'a1' && e.miktar_g === 20 && e.saat === '12:30'; }));
        return Storage.listLogByDate('2026-09-20');
      }).then(function (gun) { t('Depolama: tarihe göre listeleme', gun.length === 2); });
    })
    .catch(function (e) { t('Depolama gidiş-dönüş hatasız (' + e + ')', false); });

  sirali.then(function () {
    out.push('');
    out.push(fails === 0 ? 'SONUÇ: TÜM TESTLER GEÇTİ' : 'SONUÇ: ' + fails + ' TEST BAŞARISIZ');
    var el = document.getElementById('out');
    el.textContent = out.join('\n');
    document.body.setAttribute('data-sonuc', fails === 0 ? 'gecti' : 'basarisiz');
  });
})();
</script>
